name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: CI / Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate -w apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  integration:
    name: CI / Integration
    runs-on: ubuntu-24.04
    env:
      # Prisma (schema.prisma) lee DATABASE_URL; las pruebas de integración
      # leen específicamente DATABASE_URL_TEST (ver vitest.integration.config.ts).
      # Ambas apuntan al mismo Postgres temporal de este job.
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/realtime_chat_ci
      DATABASE_URL_TEST: postgresql://ci_user:ci_password@127.0.0.1:5432/realtime_chat_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: realtime_chat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d realtime_chat_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate -w apps/api

      - name: Aplicar migraciones
        run: npm run db:migrate:deploy -w apps/api

      - name: Pruebas de integración
        run: npm run test:integration -w apps/api

  docker:
    name: CI / Docker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Crear .env temporal (valores ficticios, exclusivos de CI)
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ci_docker_user
          POSTGRES_PASSWORD=ci_docker_password
          POSTGRES_DB=realtime_chat_ci_docker
          POSTGRES_PORT=55432
          API_PORT=3000
          DATABASE_URL=postgresql://ci_docker_user:ci_docker_password@postgres:5432/realtime_chat_ci_docker
          SOCKET_CORS_ORIGIN=http://localhost:8080
          MESSAGE_HISTORY_DEFAULT_LIMIT=50
          MESSAGE_HISTORY_MAX_LIMIT=100
          WEB_PORT=8080
          VITE_API_URL=http://localhost:3000
          VITE_SOCKET_URL=http://localhost:3000
          EOF

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar el stack
        run: docker compose up -d

      - name: Esperar a que el stack esté saludable
        run: |
          set -euo pipefail

          wait_for_healthy() {
            local service="$1"
            local max_attempts=40
            local attempt=0
            local cid status
            until [ "$attempt" -ge "$max_attempts" ]; do
              cid="$(docker compose ps -q "$service")"
              if [ -n "$cid" ]; then
                status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "sin-healthcheck")"
                if [ "$status" = "healthy" ]; then
                  echo "$service: healthy (intento $attempt)"
                  return 0
                fi
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            echo "Timeout esperando que $service esté healthy"
            docker compose ps -a
            return 1
          }

          wait_for_exit_zero() {
            local service="$1"
            local max_attempts=40
            local attempt=0
            local cid status code
            until [ "$attempt" -ge "$max_attempts" ]; do
              cid="$(docker compose ps -a -q "$service")"
              if [ -n "$cid" ]; then
                status="$(docker inspect -f '{{.State.Status}}' "$cid")"
                if [ "$status" = "exited" ]; then
                  code="$(docker inspect -f '{{.State.ExitCode}}' "$cid")"
                  if [ "$code" = "0" ]; then
                    echo "$service: completado con código 0 (intento $attempt)"
                    return 0
                  fi
                  echo "$service terminó con código $code"
                  docker compose logs --no-color "$service"
                  return 1
                fi
              fi
              attempt=$((attempt + 1))
              sleep 3
            done
            echo "Timeout esperando que $service termine"
            docker compose ps -a
            return 1
          }

          wait_for_healthy postgres
          wait_for_exit_zero migrate
          wait_for_healthy api
          wait_for_healthy web

      - name: Estado de los contenedores
        run: docker compose ps -a

      - name: Cleanup del stack temporal
        if: always()
        run: |
          # docker compose down -v es seguro aquí porque el runner es
          # temporal y se destruye igual al terminar. NUNCA copiar este
          # comando para ejecutarlo contra un stack local persistente.
          docker compose down -v --remove-orphans || true
