name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality:
    name: CI / Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate -w apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  integration:
    name: CI / Integration
    runs-on: ubuntu-24.04
    env:
      # Prisma (schema.prisma) lee DATABASE_URL; las pruebas de integración
      # leen específicamente DATABASE_URL_TEST (ver vitest.integration.config.ts).
      # Ambas apuntan al mismo Postgres temporal de este job.
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/realtime_chat_ci
      DATABASE_URL_TEST: postgresql://ci_user:ci_password@127.0.0.1:5432/realtime_chat_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: realtime_chat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d realtime_chat_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run db:generate -w apps/api

      - name: Aplicar migraciones
        run: npm run db:migrate:deploy -w apps/api

      - name: Pruebas de integración
        run: npm run test:integration -w apps/api
