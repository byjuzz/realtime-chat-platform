server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae a index.html (React Router-less,
    # pero mantiene recargas de página funcionando en rutas futuras).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mismo origen para la API REST, evita CORS entre frontend y backend.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://api:3000/health;
    }

    location = /ready {
        proxy_pass http://api:3000/ready;
    }

    # Mismo origen para Socket.IO, con soporte de upgrade a WebSocket.
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
