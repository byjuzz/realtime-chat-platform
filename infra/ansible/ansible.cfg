[defaults]
# Inventario explícito y local — ver inventories/lab/README.md.
inventory = inventories/lab/hosts.local.yml

# Nunca deshabilitar la verificación de host key SSH (aunque en este laboratorio
# el nodo administrado usa conexión local, no SSH — se deja explícito por si
# en el futuro se agregan nodos remotos vía SSH real).
host_key_checking = True

# El intérprete de Python se descubre automáticamente en el nodo remoto,
# sin advertencias ruidosas si hay más de uno disponible.
interpreter_python = auto_silent

# No dejar archivos .retry sueltos tras un playbook fallido.
retry_files_enabled = False

nocows = 1

[privilege_escalation]
# Sin escalamiento de privilegios global. Cada tarea que lo necesite lo declara
# explícitamente (become: true) en el futuro, no todo el playbook por defecto.
become = False
